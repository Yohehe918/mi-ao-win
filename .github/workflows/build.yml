name: Windows build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q -k 'not test_clipboard'
      - name: Build application and installer
        shell: pwsh
        run: ./scripts/build_release.ps1 -Compiler 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: mi-ao-win-x64
          path: dist/release/
